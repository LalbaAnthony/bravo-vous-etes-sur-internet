<VirtualHost *:80>
    ServerName bravo-vous-etes-sur-internet.fr
    ServerAlias www.bravo-vous-etes-sur-internet.fr
    DocumentRoot /var/www/html/bravo-vous-etes-sur-internet.fr

    <Directory />
        Require all denied
    </Directory>

    <Directory /var/www/html/bravo-vous-etes-sur-internet.fr>
        AllowOverride All
        Require all granted
    </Directory>

    # Redirection vers HTTPS
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =bravo-vous-etes-sur-internet.fr [OR]
    RewriteCond %{SERVER_NAME} =www.bravo-vous-etes-sur-internet.fr
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
    ErrorLog ${APACHE_LOG_DIR}/bravo-vous-etes-sur-internet.fr_error.log
    CustomLog ${APACHE_LOG_DIR}/bravo-vous-etes-sur-internet.fr_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName bravo-vous-etes-sur-internet.fr
        ServerAlias www.bravo-vous-etes-sur-internet.fr
        DocumentRoot /var/www/html/bravo-vous-etes-sur-internet.fr

        Protocols h2 h2c http/1.1
        ProtocolsHonorOrder On

        <Directory />
            Require all denied
        </Directory>

        <Directory /var/www/html/bravo-vous-etes-sur-internet.fr>
            AllowOverride All
            Require all granted
        </Directory>

        SSLEngine on
        Include /etc/letsencrypt/options-ssl-apache.conf

        ErrorLog ${APACHE_LOG_DIR}/bravo-vous-etes-sur-internet.fr_error.log
        CustomLog ${APACHE_LOG_DIR}/bravo-vous-etes-sur-internet.fr_access.log combined
        SSLCertificateFile /etc/letsencrypt/live/bravo-vous-etes-sur-internet.fr/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/bravo-vous-etes-sur-internet.fr/privkey.pem
    </VirtualHost>
</IfModule>
